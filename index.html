<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luyện thi VB2 — Toán Cao Cấp</title>

<!-- MathJax config TRƯỚC khi load script -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(','\\)'], ['$','$']],
    displayMath: [['$$','$$'], ['\\[','\\]']],
    processEscapes: true
  },
  options: { skipHtmlTags: ['script','noscript','style','textarea'] },
  startup: { typeset: false }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>

<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="wrap">

  <!-- Header -->
  <div class="header">
    <div class="header-badge">VB2CA · BCA 2026</div>
    <h1>🎯 Luyện thi Toán Cao Cấp</h1>
    <p>Chọn dạng bài → Load đề → Làm câu hỏi → Xem giải chi tiết</p>
  </div>
<!-- countdown -->
<div id="countdown" >
  ⏳ Đang tính...
</div>
  <!-- Toolbar -->
  <div class="toolbar">
    <select id="type">
      <option value="matran">Ma trận & Định thức</option>
      <option value="gioihan_lientuc_khavi">Giới hạn, liên tục, & khả vi</option>
      <option value="daoham">Đạo hàm</option>
      <option value="daohamrieng">Đạo hàm riêng</option>
      <option value="gioihan">Giới hạn</option>
      <option value="tichphan">Tích phân</option>
      <option value="chuoiso">Chuỗi số</option>
      <option value="pt_viphan_cap1">PT Vi phân cấp 1</option>
      <option value="pt_viphan_cap2">PT Vi phân cấp 2</option>
    </select>
    <button class="btn primary" onclick="loadData()">📂 Load đề</button>
    <button class="btn" onclick="shuffle()">🔀 Random</button>
    <button class="btn" onclick="resetData()">🗑 Reset</button>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card"><span class="stat-val s-current" id="s-cur">—</span><span class="stat-lbl">Câu hiện tại</span></div>
    <div class="stat-card"><span class="stat-val s-total"   id="s-tot">0</span><span class="stat-lbl">Đã làm</span></div>
    <div class="stat-card"><span class="stat-val s-right"   id="s-rig">0</span><span class="stat-lbl">Đúng</span></div>
    <div class="stat-card"><span class="stat-val s-wrong"   id="s-wro">0</span><span class="stat-lbl">Sai</span></div>
  </div>

  <!-- Progress -->
  <div class="progress"><div class="progress-bar" id="prog" style="width:0%"></div></div>

  <!-- Question Card -->
  <div class="q-card" id="q-card">
    <div class="center-box">
      <div class="spinner"></div>
      <p>Đang tải câu hỏi...</p>
    </div>
  </div>

  <!-- Nav -->
  <div class="nav-row">
    <button class="btn" onclick="goPrev()">← Trước</button>
    <div class="nav-info" id="nav-info">—</div>
    <button class="btn primary" onclick="goNext()">Tiếp theo →</button>
  </div>

</div><!-- /wrap -->

function renderQ() {

}
  updateStats();

      </div>

/* ================================================================
   RENDER MATRIX — dùng LaTeX pmatrix thay vì HTML table
================================================================ */
function renderMatrix(matrix) {
  let rows = matrix.map(row => row.join(' & ')).join(' \\\\ ');
  return '\\[\\begin{pmatrix}' + rows + '\\end{pmatrix}\\]';
}

/* ================================================================
   PICK ANSWER
================================================================ */
function pick(idx) {
  if (answered) return;
  selectedIdx = idx;
  userAnswers[current] = idx; // ✅ lưu

  document.querySelectorAll('.opt-btn').forEach(b => {
    b.classList.remove('selected');
  });
  document.getElementById('opt-' + idx).classList.add('selected');

  saveProgress(); // ✅ lưu localStorage
}

/* ================================================================
   SHOW ANSWER
================================================================ */
function showAnswer() {
  if (answered) return;
  answered = true;
  totalDone++;

  const q       = questions[current];
  const correct = q.correct;

  /* Tìm index đáp án đúng */
  const correctIdx = q.options.indexOf(correct);

  /* Nếu người dùng chưa chọn → coi như sai */
  const isRight = selectedIdx !== -1 && q.options[selectedIdx] === correct;
  if (isRight) totalRight++; else totalWrong++;
  updateStats();

  /* Màu sắc các nút */
  q.options.forEach((_, i) => {
    const btn = document.getElementById('opt-' + i);
    btn.disabled = true;
    if (i === correctIdx) {
      btn.classList.add(selectedIdx === correctIdx ? 'correct' : 'show-correct');
    } else if (i === selectedIdx && !isRight) {
      btn.classList.add('wrong');
    }
  });

  /* Result badge */
  document.getElementById('res-area').innerHTML = `
    <div class="result-badge ${isRight ? 'correct' : 'wrong'}">
      <span class="result-icon">${isRight ? '✓' : '✗'}</span>
      <span>${isRight ? 'Chính xác!' : (selectedIdx === -1 ? 'Bạn chưa chọn đáp án — đáp án đúng: ' + correct : 'Sai rồi — Đáp án đúng: ' + correct)}</span>
    </div>`;

  /* Hiện solution */
  document.getElementById('sol-wrap').style.display = 'block';
  renderSolContent();
  typeset();
}

/* ================================================================
   SOLUTION TABS
================================================================ */
function switchTab(tab) {
  solTab = tab;
  document.querySelectorAll('.sol-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.t === tab);
  });
  renderSolContent();
  typeset();
}

function renderSolContent() {
  const el = document.getElementById('sol-content');
  if (el) el.innerHTML = getSolHtml(solTab);
}

function getSolHtml(tab) {
  const q = questions[current];
  if (!q) return '';

  if (tab === 'giai')  return '<b>Giải nhanh:</b> ' + (q.quick    || '—');
  if (tab === 'day')   return '<b>Lời giải:</b><br>' + (q.solution || '—');
  if (tab === 'nhanh') return '<b>💡 Mẹo nhớ:</b><br>' + (q.quick || '—');
  if (tab === 'casio') return `
    <div class="casio-box">🖩 CASIO fx-580VNX
──────────────────
${q.casio || 'Không có hướng dẫn CASIO cho câu này.'}</div>`;
  return '';
}

/* ================================================================
   NAV
================================================================ */
function goNext() {
  if (!questions.length) return;
  current = (current + 1) % questions.length;
  saveProgress();
  renderQ();
}

function goPrev() {
  if (!questions.length) return;
  current = (current - 1 + questions.length) % questions.length;
  saveProgress();
  renderQ();;
}

function shuffle() {
  if (!questions.length) return;
  questions = shuffleArr(questions);
  current = 0; answered = false; selectedIdx = -1;
  renderQ();
}
function resetData() {
  localStorage.removeItem("vb2_exam");
  location.reload();
}
/* ================================================================
   STATS & PROGRESS
================================================================ */
function updateStats() {
  const total = questions.length;
  document.getElementById('s-cur').textContent = total ? (current + 1) + ' / ' + total : '—';
  document.getElementById('s-tot').textContent = totalDone;
  document.getElementById('s-rig').textContent = totalRight;
  document.getElementById('s-wro').textContent = totalWrong;
  document.getElementById('nav-info').textContent =
    total ? 'Câu ' + (current+1) + ' trong số ' + total + ' câu' : '—';

  const pct = total ? ((current) / total * 100).toFixed(0) : 0;
  document.getElementById('prog').style.width = pct + '%';
}

/* ================================================================
   MATHJAX — re-typeset chỉ phần thay đổi
================================================================ */
function typeset() {
  if (!window.MathJax || !MathJax.typesetPromise) return;
  const el = document.getElementById('q-card');
  if (el) MathJax.typesetPromise([el]).catch(() => {});
}

/* ================================================================
   SPINNER / ERROR
================================================================ */
function showSpinner() {
  document.getElementById('q-card').innerHTML = `
    <div class="center-box">
      <div class="spinner"></div>
      <p>Đang tải dữ liệu...</p>
    </div>`;
}

function showError(msg) {
  document.getElementById('q-card').innerHTML = `
    <div class="center-box">
      <p style="font-size:32px; margin-bottom:10px;">⚠️</p>
      <p style="color:#dc2626; font-weight:600; margin-bottom:8px;">Không tải được dữ liệu</p>
      <p style="color:#6b7090; font-size:13px;">${msg}</p>
    </div>`;
}

/* ================================================================
   UTILS
================================================================ */
function shuffleArr(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ================================================================
   KEYBOARD SHORTCUTS
================================================================ */
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  const map = { ArrowRight:'next', n:'next', ArrowLeft:'prev', p:'prev',
                a:'0', b:'1', c:'2', d:'3', A:'0', B:'1', C:'2', D:'3',
                Enter:'answer', ' ':'answer' };
  const act = map[e.key];
  if (!act) return;
  e.preventDefault();
  if (act === 'next')   goNext();
  else if (act === 'prev')   goPrev();
  else if (act === 'answer') showAnswer();
  else pick(parseInt(act));
});
// countdownt
function updateCountdown() {
  const examDate = new Date("2026-09-20T00:00:00");
  const now = new Date();

  const diff = examDate - now;

  if (diff <= 0) {
    document.getElementById("countdown").innerHTML =
      "🔥 Hôm nay thi rồi!";
    return;
  }

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((diff / (1000 * 60)) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  document.getElementById("countdown").innerHTML =
    `⏳ Còn <b>${days}</b> ngày ${hours}h ${minutes}m ${seconds}s đến kỳ thi VB2`;
}
